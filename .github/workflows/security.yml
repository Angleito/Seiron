name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t sei-portfolio-ai:${{ github.sha }} .
          else
            echo "No Dockerfile found, skipping Docker security scan"
            exit 0
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: hashFiles('Dockerfile') != ''
        with:
          image-ref: 'sei-portfolio-ai:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('Dockerfile') != ''
        with:
          sarif_file: 'trivy-results.sarif'

  environment-check:
    name: Environment Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets in config files
        run: |
          # Check for potential secrets in config files
          if grep -r "api_key\|secret\|password\|token" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.env*" . | grep -v ".env.example" | grep -v "your_" | grep -v "xxx" | grep -v "example"; then
            echo "⚠️  Potential hardcoded secrets found in config files:"
            grep -r "api_key\|secret\|password\|token" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.env*" . | grep -v ".env.example" | grep -v "your_" | grep -v "xxx" | grep -v "example"
            echo "Please review these files and ensure no real secrets are committed."
            exit 1
          else
            echo "✅ No hardcoded secrets found in config files"
          fi

      - name: Check Next.js security configuration
        run: |
          if [ -f "next.config.js" ]; then
            # Check for security headers
            if grep -q "headers()" next.config.js; then
              echo "✅ Security headers configured in Next.js"
            else
              echo "⚠️  No security headers found in next.config.js"
              exit 1
            fi
            
            # Check for CSP
            if grep -q "Content-Security-Policy" next.config.js; then
              echo "✅ Content Security Policy configured"
            else
              echo "⚠️  No Content Security Policy found"
              exit 1
            fi
          else
            echo "⚠️  next.config.js not found"
            exit 1
          fi

      - name: Validate environment variables
        run: |
          # Check if required environment variables are documented
          if [ -f ".env.example" ]; then
            echo "✅ Environment variables example file exists"
            
            # Check for required security variables
            required_vars=("SESSION_SECRET" "API_SECRET_KEY" "ALLOWED_ORIGINS")
            for var in "${required_vars[@]}"; do
              if grep -q "$var" .env.example; then
                echo "✅ $var is documented in .env.example"
              else
                echo "⚠️  $var is missing from .env.example"
              fi
            done
          else
            echo "⚠️  .env.example file missing"
            exit 1
          fi

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, secrets-scan, environment-check]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.dependency-scan.result }}" = "success" ]; then
            echo "✅ Dependency Security Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dependency Security Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.code-scan.result }}" = "success" ]; then
            echo "✅ Code Security Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Code Security Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.secrets-scan.result }}" = "success" ]; then
            echo "✅ Secrets Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Secrets Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.environment-check.result }}" = "success" ]; then
            echo "✅ Environment Check: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Environment Check: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For detailed results, check individual job outputs." >> $GITHUB_STEP_SUMMARY