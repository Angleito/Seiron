# Nixpacks configuration for Hive Intelligence MCP
[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.install]
cmds = ["cd .. && npm ci"]

[phases.build]
cmds = [
    "cd .. && npm install -g typescript",
    "cd .. && tsc"
]

[start]
cmd = "cd .. && node dist/hive-intelligence/server-v2.js"

[variables]
NODE_ENV = "production"